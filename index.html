<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="header">
            <div>
                <p class="small-title">MY TASKS</p>
                <h1>To-Do List <span>✓</span></h1>
                <p class="subtitle">Stay organized and get things done.</p>
            </div>

            <div class="date" id="date"></div>
        </div>


        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button id="addBtn">
                <span>+</span>
                Add Task
            </button>

        </div>


        <div class="stats">

            <div class="stat">
                <span class="stat-number" id="totalTasks">0</span>
                <span>Total</span>
            </div>

            <div class="stat">
                <span class="stat-number pending" id="pendingTasks">0</span>
                <span>Pending</span>
            </div>

            <div class="stat">
                <span class="stat-number completed" id="completedTasks">0</span>
                <span>Completed</span>
            </div>

        </div>


        <div class="tasks-header">
            <h2>My Tasks</h2>
            <button id="clearCompleted">Clear completed</button>
        </div>


        <ul id="taskList"></ul>


        <div class="empty-state" id="emptyState">

            <div class="empty-icon">✓</div>

            <h3>No tasks yet</h3>

            <p>Add a task above and start being productive.</p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
